version: "3.8"

services:
  jangada:
    image: nexus.cge.ce.gov.br/jangada:homol
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: America/Fortaleza
      AWS_SECRET_NAME: asesi/jangada/homol
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: ${SM_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SM_AWS_SECRET_ACCESS_KEY}
      ALLOW_LOCAL_BYPASS: "0"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jangada-homol.rule=Host(`homolog-jangada.cge.local`)"
        - "traefik.http.routers.jangada-homol.entrypoints=web"
        - "traefik.http.services.jangada-homol.loadbalancer.server.port=3000"
    networks:
      - proxy
      - homol

networks:
  proxy:
    external: true
  homol:
    external: true
