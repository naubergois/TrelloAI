# ==============================================================
# Jangada — Docker Compose (PRODUÇÃO / Swarm)
# ==============================================================
# Uso: docker stack deploy -c docker-compose.prod.yml jangada --with-registry-auth
# URL: http://jangada.cge.local
# Secrets: source /opt/jangada/.env.prod no manager antes do deploy
# ==============================================================

services:
  jangada:
    image: nexus.cge.ce.gov.br/jangada:prod
    container_name: jangada-prod
    restart: unless-stopped
    environment:
      TZ: America/Fortaleza
      NODE_ENV: production
      PORT: "3000"
      ALLOW_LOCAL_BYPASS: "0"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://jangada.cge.local}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      PG_HOST: ${PG_HOST:-192.168.3.26}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-h_asesi}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SCHEMA: ${PG_SCHEMA:-trelloai}
      PG_SSL: ${PG_SSL:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://litellm.cge.ce.gov.br}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek.v3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USERS_DATA_DIR: /tmp/jangada-data
      BUILD_SHA: ${BUILD_SHA:-unknown}
    networks:
      - proxy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
      placement:
        constraints:
          - "node.role==worker"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jangada-prod.rule=Host(`jangada.cge.local`)"
        - "traefik.http.routers.jangada-prod.entrypoints=web"
        - "traefik.http.routers.jangada-prod.priority=1"
        - "traefik.http.services.jangada-prod.loadbalancer.server.port=3000"
        - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: loki
      options:
        loki-url: "http://srv58-col:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"

networks:
  proxy:
    external: true
