# Homologação Jangada — smoke local (sem Swarm/Traefik)
# Uso:
#   cp docker/env.homolog.example .env.homolog
#   docker compose -f docker-compose.homol.local.yml --env-file .env.homolog up -d --build

services:
  jangada:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${JANGADA_IMAGE:-jangada:homol}
    container_name: jangada-homol
    restart: unless-stopped
    ports:
      - "${JANGADA_PORT:-5558}:3000"
    env_file:
      - ${JANGADA_ENV_FILE:-.env.homolog}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ALLOW_LOCAL_BYPASS: "0"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
